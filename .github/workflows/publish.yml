name: Publish agent wallet with provenance

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: agent-wallet-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.repository == 'voidly-ai/agent-wallet-kit' && github.ref_name != 'v0.1.0' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Verify tag, source and new version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const server = JSON.parse(readFileSync('server.json', 'utf8'));
          const expectedMcpName = 'io.github.voidly-ai/agent-wallet-kit';
          if (pkg.name !== '@voidly/agent-wallet') throw new Error('Unexpected package name');
          if (pkg.repository?.url !== 'https://github.com/voidly-ai/agent-wallet-kit') throw new Error('Repository URL mismatch');
          if (lock.name !== pkg.name || lock.version !== pkg.version ||
              lock.packages?.['']?.name !== pkg.name || lock.packages?.['']?.version !== pkg.version) {
            throw new Error('Lockfile identity or version mismatch');
          }
          if (pkg.mcpName !== expectedMcpName || server.name !== expectedMcpName ||
              server.version !== pkg.version || server.repository?.url !== pkg.repository?.url ||
              server.repository?.source !== 'github' ||
              server.packages?.length !== 1 || server.packages[0].registryType !== 'npm' ||
              server.packages[0].identifier !== pkg.name || server.packages[0].version !== pkg.version ||
              server.packages[0].transport?.type !== 'stdio') {
            throw new Error('MCP Registry identity or version mismatch');
          }
          if (process.env.RELEASE_TAG !== `v${pkg.version}`) throw new Error('Tag must match package version');
          if (pkg.version === '0.1.0') throw new Error('0.1.0 is the owner bootstrap release');
          const url = `https://registry.npmjs.org/@voidly%2fagent-wallet/${encodeURIComponent(pkg.version)}`;
          const response = await fetch(url, { headers: { accept: 'application/json' } });
          if (response.status === 200) throw new Error(`Version ${pkg.version} already exists on npm`);
          if (response.status !== 404) throw new Error(`Could not verify version absence: HTTP ${response.status}`);
          NODE
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test with bounded concurrency
        run: node --test-concurrency=4 --import tsx --test test/*.test.ts
      - name: Build
        run: npm run build
      - name: Publish by npm trusted publisher with provenance
        run: npm publish --provenance --access public

  registry-publish:
    needs: publish
    runs-on: ubuntu-latest
    environment: mcp-registry-publish
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Verify registry metadata matches the released npm package
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const server = JSON.parse(readFileSync('server.json', 'utf8'));
          const expectedName = 'io.github.voidly-ai/agent-wallet-kit';
          if (process.env.GITHUB_REPOSITORY !== 'voidly-ai/agent-wallet-kit') throw new Error('Unexpected repository');
          if (pkg.name !== '@voidly/agent-wallet' || pkg.mcpName !== expectedName) throw new Error('npm identity mismatch');
          if (server.name !== expectedName || server.version !== pkg.version) throw new Error('MCP identity or version mismatch');
          if (process.env.GITHUB_REF_NAME !== 'v' + pkg.version) throw new Error('Tag must match package version');
          if (server.repository?.url !== pkg.repository?.url || server.repository?.source !== 'github') throw new Error('Source repository mismatch');
          if (server.packages?.length !== 1 || server.packages[0].registryType !== 'npm' ||
              server.packages[0].identifier !== pkg.name || server.packages[0].version !== pkg.version ||
              server.packages[0].transport?.type !== 'stdio') throw new Error('MCP package mismatch');
          NODE
      - name: Wait for exact npm version visibility
        timeout-minutes: 11
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { setTimeout as sleep } from 'node:timers/promises';

          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const url = `https://registry.npmjs.org/@voidly%2fagent-wallet/${encodeURIComponent(pkg.version)}`;
          const deadline = performance.now() + 10 * 60_000;
          let attempts = 0;
          let visible = false;

          while (performance.now() < deadline) {
            attempts += 1;
            const remaining = Math.max(1, Math.floor(deadline - performance.now()));
            let response;
            try {
              response = await fetch(url, {
                headers: { accept: 'application/json', 'cache-control': 'no-cache' },
                signal: AbortSignal.timeout(Math.min(10_000, remaining)),
              });
            } catch (error) {
              console.warn(`npm visibility request ${attempts} failed: ${error.message}`);
            }

            if (response?.status === 200) {
              let record;
              try {
                record = await response.json();
              } catch (error) {
                throw new Error('npm returned malformed version metadata', { cause: error });
              }
              if (record.name !== pkg.name || record.version !== pkg.version || record.mcpName !== pkg.mcpName) {
                throw new Error('npm version metadata does not match the release');
              }
              console.log(`npm ${pkg.name}@${pkg.version} visible after ${attempts} request(s)`);
              visible = true;
              break;
            }

            if (response) {
              const status = response.status;
              await response.body?.cancel();
              if (status !== 404 && status !== 429 && (status < 500 || status > 599)) {
                throw new Error(`Unexpected npm visibility status: HTTP ${status}`);
              }
              console.log(`npm ${pkg.name}@${pkg.version} not visible yet (HTTP ${status})`);
            }

            const waitMs = Math.min(20_000, Math.max(0, Math.floor(deadline - performance.now())));
            if (waitMs > 0) await sleep(waitMs);
          }

          if (!visible) throw new Error(`npm ${pkg.name}@${pkg.version} was not visible within 10 minutes`);
          NODE
      - name: Install MCP Registry publisher
        run: |
          curl --fail --location --silent --show-error \
            --output mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz' | sha256sum --check
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          sudo install -m 0755 mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --help
      - name: Validate server.json
        run: mcp-publisher validate
      - name: Authenticate to MCP Registry with GitHub OIDC
        run: mcp-publisher login github-oidc
      - name: Publish server metadata
        run: mcp-publisher publish
